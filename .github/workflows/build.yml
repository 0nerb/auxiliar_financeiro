name: Build Installers

# Quando rodar:
#  - push: a cada envio para a branch main
#  - workflow_dispatch: botão "Run workflow" manual na aba Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------- Instalador do Windows (.exe) ----------
  windows:
    runs-on: windows-latest
    # O app desktop vive em desktop/ (a raiz é o monorepo).
    # A interface em shared/ é puxada pelo Vite via alias.
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador Windows
        run: npm run dist:win

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: desktop/release/*.exe
          if-no-files-found: error
          # Cada instalador ocupa centenas de MB. Sem prazo de validade a cota
          # de armazenamento do GitHub estoura e novos envios passam a falhar.
          # Baixe o .exe que quiser guardar — depois desse prazo ele é removido.
          retention-days: 14
